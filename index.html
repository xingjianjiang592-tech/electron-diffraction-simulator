}

let rafPending = false;
function scheduleRender(){
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(()=>{ rafPending = false; render(); });
}

/* =========================================================
   ★ 修改 #F：多晶 viewR 自动适配
   ========================================================= */
function autoFitPolyView(){
  const lam = wavelength(state.voltage);
  const lat = recipLattice(state.a, state.b, state.c, state.alpha, state.beta, state.gamma);
  if (!lat) return;
  const { rings } = computeRings(lam, lat, activeBasis, maxF);
  if (!rings.length) return;
  let maxR = 0;
  for (const ring of rings){
    const sinTheta = lam * ring.gm / 2;
    if (sinTheta >= 0.999) continue;
    const R = state.camLen * Math.tan(2 * Math.asin(sinTheta));
    if (R > maxR) maxR = R;
  }
  if (maxR > 0){
    const newViewR = Math.min(60, Math.max(3, maxR * 1.4));
    if (Math.abs(newViewR - state.viewR) > 0.5) setParamValue('viewR', newViewR);
  }
}

function render(){
  // ★ 每次渲染触发持久化（节流）
  scheduleSaveState();

  const lam = wavelength(state.voltage);
  document.getElementById('out_lam').innerHTML =
    `<span class="k">波长 λ</span> <b>${(lam*1000).toFixed(3)} pm</b>`;
  document.getElementById('out_cam').innerHTML =
    `<span class="k">相机常数 Lλ</span> <b>${(state.camLen*lam).toFixed(3)} mm·nm</b>`;

  if (state.sampleType === 'amorphous'){
    const rings = computeAmorphousRings(lam);
    document.getElementById('out_maxF').innerHTML =
      `<span class="k">结构</span> <span class="amor">非晶（短程序）</span>`;
    document.getElementById('out_mode').innerHTML =
      `<span class="k">模式</span> <b>非晶</b>`;
    document.getElementById('out_ext').innerHTML =
      `<span class="k">弥散晕环</span> <b>${rings.length}</b> 个`;
    document.getElementById('out_twin').innerHTML =
      `<span class="k">孪晶</span> <span style="color:#5a6b7c">非晶模式不适用</span>`;
    document.getElementById('out_holz').innerHTML =
      `<span class="k">HOLZ</span> <span style="color:#5a6b7c">非晶模式不适用</span>`;
    document.getElementById('out_double').innerHTML =
      `<span class="k">二次衍射</span> <span style="color:#5a6b7c">非晶模式不适用</span>`;
    document.getElementById('out_defect').innerHTML =
      `<span class="k">缺陷</span> <span style="color:#5a6b7c">非晶模式不适用</span>`;
    drawAmorphousPattern(rings, lam);
    draw3DAmorphous();
    return;
  }

  const lat = recipLattice(state.a, state.b, state.c, state.alpha, state.beta, state.gamma);
  const quasi = isQuasi();

  document.getElementById('out_maxF').innerHTML = quasi
    ? `<span class="k">基元</span> <span class="quasi">准晶体（无常规基元）</span>`
    : `<span class="k">基元散射因子 Σw</span> <b>${maxF.toFixed(1)}</b>`;
  document.getElementById('out_mode').innerHTML =
    `<span class="k">模式</span> <b>${state.sampleType === 'poly' ? '多晶' : (quasi ? '准晶' : '单晶')}</b>`;

  if (!lat){
    const c = document.getElementById('canvasPattern');
    const ctx = c.getContext('2d');
    ctx.clearRect(0,0,WP,HP);
    ctx.fillStyle = '#04070b'; ctx.fillRect(0,0,WP,HP);
    ctx.fillStyle = '#f2a54a';
    ctx.font = '13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('晶格参数不合法（体积为零）', WP/2, HP/2);
    ctx.textAlign = 'left';
    return;
  }

  if (state.sampleType === 'poly'){
    const { rings, gmax } = computeRings(lam, lat, activeBasis, maxF);
    drawPolyPattern(rings, lam);
    draw3D([], gmax, lam);
    document.getElementById('out_ext').innerHTML =
      `<span class="k">德拜-谢乐环</span> <b>${rings.length}</b> 个`;
    document.getElementById('out_twin').innerHTML =
      `<span class="k">孪晶</span> <span style="color:#5a6b7c">多晶模式下不适用</span>`;
    document.getElementById('out_holz').innerHTML =
      `<span class="k">HOLZ</span> <span style="color:#5a6b7c">多晶模式下不适用</span>`;
    document.getElementById('out_double').innerHTML =
      `<span class="k">二次衍射</span> <span style="color:#5a6b7c">多晶模式下不适用</span>`;
    document.getElementById('out_defect').innerHTML =
      `<span class="k">缺陷</span> <span style="color:#5a6b7c">多晶模式下不适用</span>`;
    return;
  }

  const { reflections, gmax, hasTwin, isQuasi: qm } = computeReflections(lam, lat, activeBasis, maxF);
  const spots = [];
  let extinct = 0;

  for (const ref of reflections){
    if (ref.Fn < 1e-4){ extinct++; continue; }
    const shape = Math.exp(-(ref.s/state.sigma)*(ref.s/state.sigma));
    const I = ref.Fn*ref.Fn * shape;
    if (I < 0.002) continue;
    const kz = 1/lam + ref.g[2];
    if (kz <= 0.001) continue;
    const X = state.camLen * ref.g[0] / kz;
    const Y = state.camLen * ref.g[1] / kz;
    spots.push({...ref, I, X, Y});
  }

  let dblInfo = { active: false };
  if (state.doubleDiffraction === 'on' && !qm && state.sampleType === 'single'){
    addDoubleDiffraction(spots, lam, lat, activeBasis, maxF);
    dblInfo.active = true;
  }

  const dLabel = {
    thermal:'TDS', point:'点缺陷', dislocation:'位错',
    fault:'层错', gb:'小角晶界', nano:'纳米晶', precipitate:'析出相'
  };
  const defectInfo = {
    active: state.defectType !== 'none' && !qm,
    label: dLabel[state.defectType] || '',
  };
  if (defectInfo.active) applyDefects(spots, lat, lam);

  drawSinglePattern(spots, reflections, lam, extinct, hasTwin, qm, defectInfo, dblInfo);
  draw3D(spots, gmax, lam);

  const nTwin1 = spots.filter(s=>s.source==='twin' || s.source==='twin1').length;
  const nTwin2 = spots.filter(s=>s.source==='twin2').length;
  const nHOLZ = spots.filter(s=>s.isHOLZ).length;
  const nDef = spots.filter(s=>s.source==='diffuse' || s.source==='precipitate').length;
  const nDbl = spots.filter(s=>s.source==='double').length;

  if (qm){
    document.getElementById('out_ext').innerHTML =
      `<span class="k">准晶</span> <span class="quasi">无常规消光</span>`;
    document.getElementById('out_twin').innerHTML =
      `<span class="k">孪晶</span> <span style="color:#5a6b7c">准晶模式下不适用</span>`;
    document.getElementById('out_holz').innerHTML =
      state.showHOLZ === 'on'
        ? `<span class="k">HOLZ</span> <span class="holz">${nHOLZ}</span> 个`
        : `<span class="k">HOLZ</span> <span style="color:#5a6b7c">关闭</span>`;
    document.getElementById('out_double').innerHTML =
      `<span class="k">二次衍射</span> <span style="color:#5a6b7c">准晶不适用</span>`;
    document.getElementById('out_defect').innerHTML =
      `<span class="k">缺陷</span> <span style="color:#5a6b7c">准晶不适用</span>`;
  } else {
    document.getElementById('out_ext').innerHTML =
      `<span class="k">系统消光</span> <b>${extinct}</b> / ${reflections.length} 个反射`;
    if (hasTwin && state.twinMode === 'triple'){
      document.getElementById('out_twin').innerHTML =
        `<span class="k">三重孪晶</span> ` +
        `<span class="twin1">120° ${nTwin1}</span> · ` +
        `<span class="twin2">240° ${nTwin2}</span>`;
    } else if (hasTwin){
      document.getElementById('out_twin').innerHTML =
        `<span class="k">孪晶</span> <span class="twin">${state.twinPlane}</span> · 斑 ${nTwin1}`;
    } else {
      document.getElementById('out_twin').innerHTML =
        `<span class="k">孪晶</span> <span style="color:#5a6b7c">关闭</span>`;
    }
    document.getElementById('out_holz').innerHTML =
      state.showHOLZ === 'on'
        ? `<span class="k">HOLZ</span> <span class="holz">${nHOLZ}</span> 个（阈值 ${state.holzThreshold.toFixed(2)} nm⁻¹）`
        : `<span class="k">HOLZ</span> <span style="color:#5a6b7c">关闭</span>`;
    if (dblInfo.active){
      document.getElementById('out_double').innerHTML =
        `<span class="k">二次衍射</span> <span class="dbl">${nDbl}</span> 个`;
    } else {
      document.getElementById('out_double').innerHTML =
        `<span class="k">二次衍射</span> <span style="color:#5a6b7c">关闭</span>`;
    }
    if (defectInfo.active){
      const extra = nDef > 0 ? `（额外弥散/析出 ${nDef}）` : '';
      document.getElementById('out_defect').innerHTML =
        `<span class="k">缺陷</span> <span class="defect">${defectInfo.label}</span> ${extra}`;
    } else {
      document.getElementById('out_defect').innerHTML =
        `<span class="k">缺陷</span> <span style="color:#5a6b7c">无（完整晶体）</span>`;
    }
  }
}

function autoFitAmorphousView(){
  const lam = wavelength(state.voltage);
  const d0  = state.amorphousD;
  const q1  = 2*Math.PI / d0;
  const sinT = lam * q1 / 2;
  if (sinT >= 0.999) return;
  const R1 = state.camLen * Math.tan(2*Math.asin(sinT));
  if (!isFinite(R1) || R1 <= 0) return;
  const newViewR = Math.min(60, Math.max(3, R1 * 1.4));
  if (Math.abs(newViewR - state.viewR) > 0.5) setParamValue('viewR', newViewR);
}

/* =========================================================
   ★ 修改 #2 & #3：带轴 UI + 控件可用性
   ========================================================= */
function updateZoneInfo(){
  const info = document.getElementById('zoneInfo');
  if (!info) return;
  const str = (state.zoneAxis || '').trim();
  if (!str){ info.textContent = ''; return; }
  const uvw = parseHKL(str);
  if (!uvw){
    info.textContent = '⚠ 格式错';
    info.style.color = '#f2a54a';
    return;
  }
  if (uvw[0]===0 && uvw[1]===0 && uvw[2]===0){
    info.textContent = '⚠ 零向量';
    info.style.color = '#f2a54a';
    return;
  }
  info.textContent = `[${uvw.join(' ')}]`;
  info.style.color = 'rgba(53,208,186,0.9)';
}

function applyZoneAxis(){
  const inp = document.getElementById('zoneInput');
  if (!inp) return;
  const val = inp.value.trim();
  // 校验：若输入非法，直接返回，不修改 state.tilt
  if (val && !parseHKL(val)){
    updateZoneInfo();
    return;
  }
  state.zoneAxis = val;
  if (val){
    setParamValue('tiltX', 0);
    setParamValue('tiltY', 0);
    // 保留 tiltZ：允许绕电子束轴旋转花样
  }
  updateZoneInfo();
  scheduleSaveState();
  scheduleRender();
}

function clearZoneAxis(){
  state.zoneAxis = '';
  const zi = document.getElementById('zoneInput');
  if (zi) zi.value = '';
  updateZoneInfo();
  scheduleSaveState();
  scheduleRender();
}

/* ★ 修改 #3：根据模式禁用不生效的控件 */
function updateControlAvailability(){
  const isSingle = state.sampleType === 'single';
  const isAmor = state.sampleType === 'amorphous';

  const setDisabled = (id, disabled) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.disabled = disabled;
    // 同步范围内的数字输入
    if (el.type === 'range' && el.parentElement){
      const numEl = el.parentElement.querySelector('.valInput');
      if (numEl) numEl.disabled = disabled;
    }
  };

  // 带轴：仅单晶
  ['zoneInput', 'zoneApply', 'zoneClear'].forEach(id => setDisabled(id, !isSingle));

  // 仅单晶可用
  const singleOnly = [
    'tiltX', 'tiltY', 'tiltZ',
    'twinMode', 'twinPlane', 'twinAxis',
    'showKikuchi', 'kikuchiAlpha',
    'showHOLZ', 'holzThreshold',
    'doubleDiffraction', 'doubleAmt', 'doubleMax', 'doubleSource',
    'defectType', 'defectAmt', 'defectSize',
  ];
  singleOnly.forEach(k => setDisabled('in_'+k, !isSingle));

  // 非晶参数：仅非晶
  ['amorphousD', 'amorphousDisp', 'amorphousRings'].forEach(k =>
    setDisabled('in_'+k, !isAmor)
  );
}

/* =========================================================
   ★ 修改 #B：导出 PNG
   ========================================================= */
function bindExport(){
  const btn = document.getElementById('btnExport');
  if (!btn) return;
  btn.addEventListener('click', ()=>{
    const canvas = document.getElementById('canvasPattern');
    const zoneStr = (state.zoneAxis || '').trim().replace(/[^\w\-]/g, '') || 'tilt';
    const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0,19);
    const a = document.createElement('a');
    a.download = `diffraction_${zoneStr}_${ts}.png`;
    a.href = canvas.toDataURL('image/png');
    a.click();
  });
}

function bindZoneBar(){
  const inp = document.getElementById('zoneInput');
  const btnApply = document.getElementById('zoneApply');
  const btnClear = document.getElementById('zoneClear');
  if (!inp) return;
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter'){ e.preventDefault(); applyZoneAxis(); }
  });
  btnApply.addEventListener('click', applyZoneAxis);
  btnClear.addEventListener('click', clearZoneAxis);
}

/* =========================================================
   UI 构建
   ========================================================= */
function buildUI(){
  const panel = document.getElementById('controls');
  for (const g of groups){
    const gd = document.createElement('div');
    gd.className = 'group';
    const title = document.createElement('div');
    title.className = 'group-title';
    title.textContent = g.title;
    gd.appendChild(title);
    for (const p of g.params){
      // ★ 持久化：已有值保留，无则用默认
      if (typeof state[p.key] === 'undefined') state[p.key] = p.def;
      paramSpecs[p.key] = p;

      if (p.type === 'select'){
        const row = document.createElement('div');
        row.className = 'flexrow';
        const lab = document.createElement('label');
        lab.setAttribute('for', 'in_'+p.key);
        lab.textContent = p.label;
        const sel = document.createElement('select');
        sel.id = 'in_'+p.key;
        for (const opt of p.options){
          const o = document.createElement('option');
          o.value = opt.value;
          o.textContent = opt.label;
          sel.appendChild(o);
        }
        sel.value = String(state[p.key]);
        sel.addEventListener('change', ()=>{
          state[p.key] = sel.value;
          if (p.key === 'latticeType'){
            onStructureChange();
            const preset = PRESETS[sel.value];
            if (preset && preset.lattice){
              for (const [kk, vv] of Object.entries(preset.lattice)) setParamValue(kk, vv);
            }
          }
          if (p.key === 'sampleType'){
            updateControlAvailability();
            if (sel.value === 'amorphous') autoFitAmorphousView();
            else if (sel.value === 'poly') autoFitPolyView();
          }
          scheduleRender();
        });
        row.appendChild(lab);
        row.appendChild(sel);
        gd.appendChild(row);
        continue;
      }

      if (p.type === 'text'){
        const row = document.createElement('div');
        row.className = 'flexrow';
        const lab = document.createElement('label');
        lab.setAttribute('for', 'in_'+p.key);
        lab.textContent = p.label;
        const inp = document.createElement('input');
        inp.type = 'text';
        inp.id = 'in_'+p.key;
        inp.value = String(state[p.key] || '');
        inp.placeholder = p.key === 'basisText' ? 'x,y,z,w; 0.5,0.5,0.5,1' : 'h,k,l';
        inp.spellcheck = false;
        if (p.key === 'basisText') basisInput = inp;
        inp.addEventListener('input', ()=>{
          state[p.key] = inp.value;
          if (p.key === 'basisText'){
            if (state.latticeType !== 'custom'){
              state.latticeType = 'custom';
              const selEl = document.getElementById('in_latticeType');
              if (selEl) selEl.value = 'custom';
            }
            updateBasis();
          }
          scheduleRender();
        });
        row.appendChild(lab);
        row.appendChild(inp);
        gd.appendChild(row);
        continue;
      }

      const row = document.createElement('div');
      row.className = 'row';
      const lab = document.createElement('label');
      lab.setAttribute('for', 'in_'+p.key);
      lab.textContent = p.label;
      lab.title = p.label;
      const slider = document.createElement('input');
      slider.type = 'range';
      slider.id = 'in_'+p.key;
      slider.min = p.min; slider.max = p.max; slider.step = p.step;
      slider.value = Number(state[p.key]);
      const wrap = document.createElement('div');
      wrap.className = 'valwrap';
      const numInp = document.createElement('input');
      numInp.type = 'number';
      numInp.className = 'valInput';
      numInp.min = p.min; numInp.max = p.max; numInp.step = p.step;
      numInp.value = Number(state[p.key]).toFixed(p.dec);
      numInp.title = '可直接输入数值，Enter 或失焦生效';
      numInp.setAttribute('aria-label', p.label);
      wrap.appendChild(numInp);
      if (p.unit){
        const unitEl = document.createElement('span');
        unitEl.className = 'unit';
        unitEl.textContent = p.unit;
        wrap.appendChild(unitEl);
      }
      const commit = ()=>{
        let v = parseFloat(numInp.value);
        if (!isFinite(v)){ numInp.value = Number(state[p.key]).toFixed(p.dec); return; }
        v = Math.min(p.max, Math.max(p.min, v));
        if (p.step > 0){
          const base = p.min;
          v = base + Math.round((v - base)/p.step) * p.step;
        }
        v = Math.min(p.max, Math.max(p.min, v));
        v = parseFloat(v.toFixed(10));
        state[p.key] = v;
        slider.value = v;
        numInp.value = v.toFixed(p.dec);
        scheduleRender();
      };
      numInp.addEventListener('change', commit);
      numInp.addEventListener('keydown', e=>{
        if (e.key === 'Enter'){ e.preventDefault(); numInp.blur(); }
        else if (e.key === 'Escape'){ numInp.value = Number(state[p.key]).toFixed(p.dec); numInp.blur(); }
      });
      numInp.addEventListener('input', ()=>{
        const v = parseFloat(numInp.value);
        if (isFinite(v) && v >= p.min && v <= p.max){
          state[p.key] = v;
          slider.value = v;
          scheduleRender();
        }
      });
      slider.addEventListener('input', ()=>{
        const v = parseFloat(slider.value);
        state[p.key] = v;
        numInp.value = v.toFixed(p.dec);
        scheduleRender();
      });
      row.appendChild(lab);
      row.appendChild(slider);
      row.appendChild(wrap);
      gd.appendChild(row);
    }
    panel.appendChild(gd);
  }

  const ro = document.createElement('div');
  ro.className = 'group';
  ro.innerHTML = `
    <div class="group-title">实时数据</div>
    <div class="readout">
      <div id="out_lam"></div>
      <div id="out_cam"></div>
      <div id="out_maxF"></div>
      <div id="out_mode"></div>
      <div id="out_twin"></div>
      <div id="out_holz"></div>
      <div id="out_double"></div>
      <div id="out_ext"></div>
      <div id="out_defect"></div>
    </div>
  `;
  panel.appendChild(ro);

  const btn = document.createElement('button');
  btn.className = 'btn';
  btn.textContent = '↺ 恢复默认参数';
  btn.addEventListener('click', ()=>{
    for (const g of groups) for (const p of g.params){
      state[p.key] = p.def;
      const el = document.getElementById('in_'+p.key);
      if (!el) continue;
      el.value = p.def;
      if (p.type === 'range'){
        const numEl = el.parentElement.querySelector('.valInput');
        if (numEl) numEl.value = p.def.toFixed(p.dec);
      }
    }
    onStructureChange();
    state.zoneAxis = '';
    const zi = document.getElementById('zoneInput');
    if (zi) zi.value = '';
    updateZoneInfo();
    updateControlAvailability();
    try { localStorage.removeItem(STORAGE_KEY); } catch(e){}
    yaw = 0.72; pitch = 0.42;
    scheduleRender();
  });
  panel.appendChild(btn);

  const tip = document.createElement('div');
  tip.style.cssText = 'margin-top:14px;font-size:11px;line-height:1.7;color:#5a6b7c;';
  tip.innerHTML = `
    <b style="color:#35d0ba">带轴快速取向</b><br>
    · 顶部输入 <b>[uvw]</b> 后按 Enter 或点"应用"，
      自动计算该带轴零层花样。<br>
    · 支持 <code>001</code> / <code>1,1,1</code> /
      <code>1-11</code>（紧凑写法）。<br>
    · 应用带轴后 tiltX/tiltY 清零；tiltZ 保留
      可用于绕束轴旋转花样。<br><br>
    <b style="color:#e2b4ff">二次衍射</b><br>
    · 强反射 g₁+g₂ 产生二次斑，可"复活"消光位置。<br>
    · 源斑类型可选"仅原晶"或"原晶+孪晶"。<br><br>
    <b style="color:#8ecbf0">非晶（短程序）</b><br>
    · 液体/硬球模型产生弥散晕环。<br>
    · d 决定环半径，σ 越大越模糊。<br><br>
    <b style="color:#ff9f6a">晶体缺陷</b><br>
    · TDS / 点缺陷 / 位错 / 层错 / 小角晶界 /
      纳米晶 / 析出相，仅单晶模式生效。<br><br>
    <b style="color:#7d8d9e">提示</b><br>
    · 参数会自动保存到浏览器 localStorage，
      刷新页面后恢复。<br>
    · 右上角 📷 按钮导出当前花样为 PNG。<br>
    · 多晶/非晶模式下不生效的控件已置灰。
  `;
  panel.appendChild(tip);
}

function bindDrag(){
  const c = document.getElementById('canvas3d');
  let dragging = false, lx = 0, ly = 0;
  c.addEventListener('pointerdown', e=>{
    dragging = true; lx = e.clientX; ly = e.clientY;
    c.setPointerCapture(e.pointerId);
  });
  c.addEventListener('pointermove', e=>{
    if (!dragging) return;
    const dx = e.clientX - lx;
    const dy = e.clientY - ly;
    lx = e.clientX; ly = e.clientY;
    yaw   += dx * 0.008;
    pitch += dy * 0.008;
    pitch = Math.max(-1.45, Math.min(1.45, pitch));
    scheduleRender();
  });
  const stop = ()=>{ dragging = false; };
  c.addEventListener('pointerup', stop);
  c.addEventListener('pointercancel', stop);
  c.addEventListener('pointerleave', stop);
}

/* =========================================================
   启动
   ========================================================= */
loadState();          // 1. 先加载持久化状态
buildUI();            // 2. 用已有/默认值建立 UI
onStructureChange();  // 3. 同步 basis
bindDrag();
bindZoneBar();
bindExport();

// 同步带轴输入框的显示值
const _zi = document.getElementById('zoneInput');
if (_zi) _zi.value = state.zoneAxis || '';

updateZoneInfo();
updateControlAvailability();

function resizeAll(){
  fitCanvases();
  scheduleRender();
}

window.addEventListener('resize', resizeAll);
if (window.ResizeObserver){
  new ResizeObserver(resizeAll).observe(document.querySelector('.app'));
}

requestAnimationFrame(()=>{
  fitCanvases();
  render();
});
</script>
